name: Backend CI

on:
  push:
    branches: [ "main" ]
    paths:
      - 'backend/**' # backend 폴더 변경 시에만 트리거
  workflow_dispatch:

jobs:
  # 빌드 작업
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 도커 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # 2. Buildx 설치 (멀티 플랫폼 빌드)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Backend 멀티 플랫폼 빌드 및 푸시
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64  # 여기서 아키텍처 지정
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bajoobang-backend:latest

  deploy-trigger:
    needs: build
    uses: ./.github/workflows/deploy.yml
    secrets: inherit

name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # 빌드 작업
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. 도커 로그인
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      
      # 2. Buildx 설치 (멀티 플랫폼 빌드)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3. Backend 멀티 플랫폼 빌드 및 푸시
      - name: Build and Push Backend Image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64  # 여기서 아키텍처 지정
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/bajoobang-backend:latest

      # 4. Frontend 멀티 플랫폼 빌드 및 푸시
      - name: Build and Push Frontend Image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            REACT_APP_KAKAOMAP_APIKEY=${{ secrets.KAKAOMAP_KEY }}
          tags: ${{ secrets.DOCKER_USERNAME }}/bajoobang-frontend:latest

  # 배포
  deploy:
    needs: build # 빌드가 성공한후 실행됨
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # 서버로 docker-compose.yml 전송
      - name: Copy docker-compose.yml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          source: "docker-compose.yml"
          target: "/home/${{ secrets.SERVER_USER }}/app" # 서버 내에 어디 저장할건지 정하고 수정

      # 서버 접속 후 .env 생성 및 배포
      - name: Execute remote ssh commands
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_KEY }}
          script: |
            cd /home/${{ secrets.SERVER_USER }}/app
            # .env 파일 생성 (환경 변수 일괄 주입)
            echo "${{ secrets.ENV_PROD }}" > .env
            # 업로드 폴더 생성 및 권한 부여
            mkdir -p uploads && chmod 777 uploads
            docker compose pull
            docker compose up -d
            docker image prune -f

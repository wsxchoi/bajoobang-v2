services:
  db:
    image: mysql:8.0
    container_name: bajoobang-db
    #restart: always
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    # DB가 실제로 준비되었는지 확인
    healthcheck: 
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 5s
      retries: 5

  backend:
    image: ${DOCKER_USERNAME}/bajoobang-backend:latest
    container_name: bajoobang-backend
    ports:
      - "8080:8080"
    env_file:
      - .env
    volumes:
      # [내 컴퓨터 경로]:[컨테이너 내부 경로]
      - ${UPLOAD_PATH:-./uploads}:/app/images
    depends_on:
      db:
        # db 컨테이너의 healthcheck가 통과하면 app 실행
        condition: service_healthy 

  nginx:
    image: ${DOCKER_USERNAME}/bajoobang-frontend:latest
    container_name: bajoobang-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mysql_data: